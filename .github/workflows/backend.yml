name: Backend CI/CD (Node + Docker + EC2)
 
on:
  push:
    branches:
      - new-backend
  workflow_dispatch:
 
jobs:
  # ========== CI JOB (Testing/Build) ==========
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
 
      - name: Install dependencies
        run: npm install
 
      # Uncomment once you have tests in package.json
      # - name: Run tests
      #   run: npm test
 
  # ========== DOCKER BUILD JOB ==========
  docker:
    runs-on: ubuntu-latest
    needs: ci
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Build Docker image
        run: |
          docker build -t exam-backend:new .
          docker save exam-backend:new -o exam-backend-image.tar
 
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-backend
          path: exam-backend-image.tar
 
  # ========== DEPLOY TO EC2 ==========
  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: success()
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-backend
          path: ./
 
      - name: Copy Docker image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "exam-backend-image.tar"
          target: "/home/ubuntu/exam-portal-backend/"
 
      - name: Deploy with Health Check & Rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Pass runtime env vars for the container as GitHub Secrets, e.g.:
          # envs: DATABASE_URL,JWT_SECRET
          