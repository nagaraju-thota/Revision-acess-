name: Trivy Security Scan

on:
  push:
    branches:
      - new-backend
  workflow_dispatch: 

env:
  BUILD_ID: build-${{ github.run_number }}

jobs:
  trivy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build Docker Image
        run: |
          docker build -t demo:${{ github.sha }} .

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | \
            sh -s -- -b /usr/local/bin
          trivy --version

      # ---------------------------------------------------------------
      
       # 1. CONFIG SCAN - DOCKERFILE ONLY (no k8s manifests in this repo)
      # ---------------------------------------------------------------
      - name: Trivy Config Scan - Dockerfile
        id: config_scan_dockerfile
        run: |
          trivy config . \
            --file-patterns dockerfile:Dockerfile \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format table \
            --output trivy-config-dockerfile-report.txt
        continue-on-error: true
      # ---------------------------------------------------------------
      # 2. FILESYSTEM SCAN - VULNERABILITIES
      # ---------------------------------------------------------------
      - name: Trivy Filesystem Scan - Vulnerabilities
        id: fs_vuln_scan
        run: |
          trivy fs . \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            --output trivy-fs-vulnerability-report.txt
        continue-on-error: true

      # ---------------------------------------------------------------
      # 3. FILESYSTEM SCAN - SECRETS
      # ---------------------------------------------------------------
      - name: Trivy Filesystem Scan - Secrets
        id: fs_secret_scan
        run: |
          trivy fs . \
            --scanners secret \
            --exit-code 1 \
            --format table \
            --output trivy-fs-secret-report.txt
        continue-on-error: true

      # ---------------------------------------------------------------
 # 4. IMAGE SCAN
      # ---------------------------------------------------------------
      - name: Trivy Image Scan
        id: image_scan
        run: |
          trivy image demo:${{ github.sha }} \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            --output trivy-image-report.txt
        continue-on-error: true
      # ---------------------------------------------------------------
      # UPLOADS TO NEXUS (revision-access-trivy-reports)
      # ---------------------------------------------------------------
      - name: Upload Image Scan report to Nexus
        run: |
          curl -v -u "${{ secrets.NEXUS_USER }}:${{ secrets.NEXUS_PASS }}" \
            --upload-file trivy-image-report.txt \
            "${{ secrets.NEXUS_URL }}/repository/revision-access-trivy-reports/image-scan/${{ env.BUILD_ID }}/trivy-image-report.txt"

      - name: Upload Filesystem Vulnerability report to Nexus
        run: |
          curl -v -u "${{ secrets.NEXUS_USER }}:${{ secrets.NEXUS_PASS }}" \
            --upload-file trivy-fs-vulnerability-report.txt \
            "${{ secrets.NEXUS_URL }}/repository/revision-access-trivy-reports/filesystem-scan/vulnerabilities/${{ env.BUILD_ID }}/trivy-fs-vulnerability-report.txt"

      - name: Upload Filesystem Secret report to Nexus
        run: |
          curl -v -u "${{ secrets.NEXUS_USER }}:${{ secrets.NEXUS_PASS }}" \
            --upload-file trivy-fs-secret-report.txt \
            "${{ secrets.NEXUS_URL }}/repository/revision-access-trivy-reports/filesystem-scan/secrets/${{ env.BUILD_ID }}/trivy-fs-secret-report.txt"

      - name: Upload Config Scan report to Nexus (Dockerfile)
        run: |
          curl -v -u "${{ secrets.NEXUS_USER }}:${{ secrets.NEXUS_PASS }}" \
            --upload-file trivy-config-dockerfile-report.txt \
            "${{ secrets.NEXUS_URL }}/repository/revision-access-trivy-reports/config-scan/dockerfile/${{ env.BUILD_ID }}/trivy-config-dockerfile-report.txt"

      # ---------------------------------------------------------------
      # GATE: fail the job if ANY scan found issues (after all uploads)
      # ---------------------------------------------------------------
      - name: Fail job if any scan found issues
        if: |
          steps.image_scan.outcome == 'failure' ||
          steps.fs_vuln_scan.outcome == 'failure' ||
          steps.fs_secret_scan.outcome == 'failure' ||
          steps.config_scan_dockerfile.outcome == 'failure'
        run: |
          echo "❌ One or more Trivy scans found issues. See uploaded reports in Nexus under ${{ env.BUILD_ID }}."
          exit 1

      - name: Deploy
        if: success()
        run: echo "Add your deployment step here"